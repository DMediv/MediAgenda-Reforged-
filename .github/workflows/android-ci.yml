name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verificar versiones fijas (P-05)
        run: |
          grep -q 'gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties \
            || { echo "::error::Gradle debe ser 9.5.0 (P-05)"; exit 1; }
          grep -Eq '^agp *= *"9.3.1"' gradle/libs.versions.toml \
            || { echo "::error::AGP debe ser 9.3.1 (P-05)"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug